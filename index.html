<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4F4" />
    <script>
      (() => {
        const storageKey = "sivi.theme.v1";
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

        try {
          const savedTheme = window.localStorage.getItem(storageKey);
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
        } catch {
          // A preferencia do sistema continua sendo usada quando o armazenamento esta indisponivel.
        }

        const inSystem = window.location.hash.startsWith('#/app/');
        if (!inSystem) theme = 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        let appearance = {};
        try { appearance = JSON.parse(window.localStorage.getItem('sivi.appearance.v1')) ?? {}; } catch {}
        const root = document.documentElement;
        root.dataset.textSize = inSystem && appearance.textSize === 'large' ? 'large' : 'standard';
        root.dataset.contrast = inSystem && appearance.contrast === 'more' ? 'more' : 'standard';
        root.dataset.colorVision = inSystem && ['redGreen', 'blueYellow'].includes(appearance.colorVision) ? appearance.colorVision : 'standard';
        root.dataset.motion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduce' : 'full';
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#101010" : "#F3F4F4";
      })();
    </script>
    <link rel="icon" href="./src/assets/brand/favicon-raposa.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./src/assets/brand/favicon-raposa.ico" />

    <meta property="og:description" content="Conecte necessidades e capacidade industrial. Da demanda ao recebimento, com cada condição registrada." />

  <body>
    <noscript><p>Ative o JavaScript para conhecer o SIVI e usar o cadastro e o acesso à plataforma.</p></noscript>
    <div data-public-surface hidden></div>
    <template id="public-home-opening">
      <div class="sivi-public-ui" data-home-hero-shell aria-hidden="true">
        <div class="sv-landing" data-home-opening>
          <div class="sv-hero" data-hero-phase="opening">
            <div class="sv-hero-opening">
              <img class="sv-hero-opening-photo" src="./assets/home-hero-opening.webp" width="1600" height="1200" alt="" fetchpriority="high" />
              <div class="sv-hero-opening-brand">
                <img src="./src/assets/brand/raposa.svg" width="96" height="96" alt="" />
                <span>SIVI</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <div class="boot-surface" data-boot-surface role="status" aria-live="polite">
      <span aria-hidden="true"><i></i><i></i><i></i></span>
      <strong>Preparando seu contexto SIVI</strong>
    </div>
    <div data-auth-surface hidden></div>
    <div data-app-root hidden></div>

    <aside class="static-preview-notice" hidden>
      <strong>Prévia estática</strong>
      Para usar animações e Firebase, abra esta pasta com o <code>Live Server</code>.
    </aside>

    <script>
      if (window.location.protocol === "file:") {
        document.querySelector(".static-preview-notice").hidden = false;
      } else {
        const [route, search] = window.location.hash.slice(1).split("?");
        const params = new URLSearchParams(search);
        const section = params.get("secao");
        if ((!route || route === "/") && !params.get("pagina") && (!section || section === "topo")) {
          const surface = document.querySelector("[data-public-surface]");
          const template = document.getElementById("public-home-opening");
          surface.append(template.content.cloneNode(true));
          surface.hidden = false;
          window.setTimeout(() => {
            if (document.body.dataset.surface) return;
            surface.hidden = true;
            surface.replaceChildren();
          }, 8000);
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
